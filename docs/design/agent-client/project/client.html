  :root{
    --bg:#0a0e1a;

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}

  ::-webkit-scrollbar-track{background:transparent}
  #root{min-height:100vh}

/* ---------------- Sidebar ---------------- */
function Sidebar({ section, setSection, onPick, activeAgentId, history, onOpenHistory, activeHistoryId }) {
  const navItems = [
    { id: "tools", label: "도구 관리", icon: "tools" },
    { id: "agents", label: "에이전트", icon: "agent" },
    { id: "history", label: "채팅 히스토리", icon: "history" },
  ];

    <aside style={{
      width: 268, flexShrink: 0, borderRight: "1px solid var(--border)",
      background: "linear-gradient(180deg, #0c1322 0%, #0a0e1a 100%)",
      display: "flex", flexDirection: "column", height: "100vh", position: "sticky", top: 0,
    }}>
      {/* Brand */}
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"18px 20px",borderBottom:"1px solid var(--border)"}}>
        <div style={{
          width:36,height:36,borderRadius:9,
          background:"linear-gradient(135deg, #3b82f6, #1e40af)",
          display:"flex",alignItems:"center",justifyContent:"center",
          boxShadow:"0 6px 16px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.2)"
        }}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.2" strokeLinejoin="round">
            <path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>
          </svg>
        </div>
        <div>
          <div style={{fontWeight:700,letterSpacing:.2}}>Agent002</div>
          <div style={{fontSize:11,color:"var(--muted-2)",marginTop:1}}>Client · v1.0.0</div>
        </div>
      </div>

      {/* Nav */}
      <nav style={{padding:"14px 12px 6px"}}>
        <div style={{fontSize:10,letterSpacing:1.4,color:"var(--muted-2)",padding:"8px 10px 6px",fontWeight:600}}>MENU</div>
        {navItems.map(it => (
          <button key={it.id} onClick={()=>setSection(it.id)} style={navBtnStyle(section===it.id)}>
            <Icon name={it.icon} size={17}/>
            <span>{it.label}</span>
            {it.id==="history" && history.length>0 && (
              <span style={navCountStyle}>{history.length}</span>

        ))}

          <>

            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {AGENTS.map(a => (
                <button key={a.id} onClick={()=>onPick(a)} style={agentRowStyle(activeAgentId===a.id)}>
                  <span style={{
                    width:26,height:26,borderRadius:7,flexShrink:0,
                    background:`linear-gradient(135deg, ${a.color}, ${a.color}66)`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    boxShadow:`0 0 0 1px ${a.color}40, 0 4px 10px ${a.color}30`
                  }}>
                    <Icon name={a.icon} size={14} stroke={2}/>
                  </span>
                  <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500,fontSize:13}}>{a.name}</span>
                  <span style={{

  background: active ? "linear-gradient(90deg, rgba(59,130,246,.18), rgba(59,130,246,.04))" : "transparent",
  color: active ? "#dbeafe" : "var(--muted)",
  fontWeight: active ? 600 : 500, fontSize:13.5,
  border: active ? "1px solid rgba(59,130,246,.35)" : "1px solid transparent",
  marginBottom:2,
  transition:"all .15s",
});

const navCountStyle = {
  marginLeft:"auto",fontSize:10,fontWeight:700,color:"var(--muted)",
  background:"#1a2440",borderRadius:10,padding:"2px 7px",
};

const subHeaderStyle = {
  fontSize:10,letterSpacing:1.2,color:"var(--muted-2)",
  padding:"12px 10px 8px",fontWeight:600,
};

const agentRowStyle = (active) => ({
  display:"flex",alignItems:"center",gap:10,
  padding:"8px 10px",borderRadius:8,width:"100%",
  background: active ? "rgba(59,130,246,.12)" : "transparent",
  border: active ? "1px solid rgba(59,130,246,.3)" : "1px solid transparent",
  color:"var(--text)",
  transition:"all .15s",
});

const historyRowStyle = (active) => ({
  display:"flex",alignItems:"center",gap:10,
  padding:"9px 10px",borderRadius:8,width:"100%",textAlign:"left",
  background: active ? "rgba(59,130,246,.10)" : "transparent",

/* ---------------- Header ---------------- */
function Header({ crumbs, agent, onClose }) {
  return (
    <header style={{
      height:64, flexShrink:0, borderBottom:"1px solid var(--border)",
      display:"flex", alignItems:"center", padding:"0 24px", gap:14,
      background:"rgba(13,20,36,.6)", backdropFilter:"blur(8px)"
    }}>
      <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--muted)"}}>
        {crumbs.map((c,i) => (
          <React.Fragment key={i}>
            {i>0 && <span style={{color:"var(--muted-2)"}}>›</span>}
            <span style={{color: i===crumbs.length-1 ? "var(--text)":"var(--muted)", fontWeight: i===crumbs.length-1 ? 500 : 400}}>{c}</span>
          </React.Fragment>
        ))}
      </div>
      <div style={{flex:1}}/>
      <div style={{position:"relative"}}>
        <Icon name="search" size={15}/>
        <input placeholder="Search..." style={{
          position:"absolute",left:0,top:0,paddingLeft:32,
          width:260,height:34,borderRadius:8,
          background:"#0c1322",border:"1px solid var(--border)",
          color:"var(--text)",outline:"none",fontSize:13,
        }}
        onFocus={e=>e.target.style.borderColor="var(--primary)"}
        onBlur={e=>e.target.style.borderColor="var(--border)"}/>
        <span style={{position:"absolute",left:11,top:9,color:"var(--muted-2)",pointerEvents:"none"}}><Icon name="search" size={14}/></span>
      </div>
      <button style={{position:"relative",padding:8,borderRadius:8,color:"var(--muted)"}}>
        <Icon name="bell" size={17}/>
        <span style={{position:"absolute",top:7,right:7,width:7,height:7,borderRadius:7,background:"#fb923c",boxShadow:"0 0 6px #fb923c"}}/>
      </button>
    </header>
  );
}

/* ---------------- Agents Gallery ---------------- */

  const [q, setQ] = useState("");
  const filtered = AGENTS.filter(a => a.name.toLowerCase().includes(q.toLowerCase()) || a.desc.toLowerCase().includes(q.toLowerCase()));
  return (
    <div style={{padding:"32px 36px",maxWidth:1240,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:24,gap:16,flexWrap:"wrap"}}>
        <div>

function renderRich(text) {
  // Very small markdown-ish: **bold**, `code`, ```block```, lines preserve.
  // Split by code blocks first
  const blocks = text.split(/```([\s\S]*?)```/g);
  return blocks.map((b, i) => {
    if (i % 2 === 1) {
      return (
        <pre key={i} style={{
          margin:"10px 0",padding:"12px 14px",borderRadius:8,
          background:"#070b16",border:"1px solid var(--border)",
          fontFamily:"'JetBrains Mono', monospace", fontSize:12, lineHeight:1.55,
          overflowX:"auto", color:"#bfdbfe"
        }}>{b.trim()}</pre>
      );
    }
    // inline format
    return <span key={i}>{inlineFormat(b)}</span>;
  });
}
function inlineFormat(s) {
  const parts = [];
  let rest = s, key = 0;
  const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
  let m, last = 0;
  while ((m = re.exec(rest)) !== null) {
    if (m.index > last) parts.push(rest.slice(last, m.index));
    const tok = m[0];
    if (tok.startsWith("**")) parts.push(<strong key={key++} style={{color:"#fff"}}>{tok.slice(2,-2)}</strong>);
    else parts.push(<code key={key++} style={{background:"#1a2440",padding:"1px 6px",borderRadius:4,fontFamily:"'JetBrains Mono', monospace",fontSize:12,color:"#bfdbfe"}}>{tok.slice(1,-1)}</code>);
    last = m.index + tok.length;
  }
  if (last < rest.length) parts.push(rest.slice(last));
  return parts;
}

function TypingDots() {
  return (
    <span style={{display:"inline-flex",gap:5,alignItems:"center",height:18}}>

    </span>
  );
}

  const send = (text) => {
    const t = (text ?? input).trim();
    if (!t || busy) return;
    const now = new Date().toLocaleTimeString("ko-KR", {hour:"2-digit",minute:"2-digit"});

    setInput("");

    setTimeout(() => {

        }}>
          <Icon name={agent.icon} size={20} stroke={2}/>
        </div>
        <div style={{flex:1,minWidth:0}}>

            <div style={{display:"flex",alignItems:"center",gap:11}}>
              <div style={{
                width:38,height:38,borderRadius:9,
                background:`linear-gradient(135deg, ${t.color}, ${t.color}66)`,
                display:"flex",alignItems:"center",justifyContent:"center",
                boxShadow:`0 0 0 1px ${t.color}40`
              }}>
                <Icon name="tools" size={17} stroke={2}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600}}>{t.name}</div>
                <div style={{fontSize:11,color:"var(--muted-2)",marginTop:2}}>{t.cat}</div>
              </div>
              <Toggle on={t.on}/>
            </div>
            <p style={{margin:0,fontSize:12,color:"var(--muted)",lineHeight:1.55}}>{t.desc}</p>
            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color: t.on ? "var(--green)":"var(--muted-2)"}}>
              <span style={{width:6,height:6,borderRadius:6,background: t.on ? "var(--green)":"var(--muted-2)",boxShadow: t.on?"0 0 6px var(--green)":"none"}}/>
              {t.on ? "연결됨" : "연결되지 않음"}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Toggle({ on:initial }) {
  const [on, setOn] = useState(initial);
  return (
    <button onClick={()=>setOn(v=>!v)} style={{
      width:38,height:22,borderRadius:11,position:"relative",
      background: on ? "linear-gradient(135deg,#2563eb,#3b82f6)" : "#1f2a44",
      transition:"all .2s",
      boxShadow: on ? "0 0 0 1px rgba(59,130,246,.4)" : "0 0 0 1px var(--border)"
    }}>
      <span style={{
        position:"absolute",top:2,left: on ? 18 : 2, width:18,height:18,borderRadius:"50%",
        background:"#fff",transition:"left .2s",boxShadow:"0 2px 4px rgba(0,0,0,.4)"
      }}/>
    </button>
  );
}

/* ---------------- Root App ---------------- */
function App() {
  const [section, setSection] = useState("agents"); // tools | agents | history
  const [activeAgent, setActiveAgent] = useState(null);
  const [activeHistory, setActiveHistory] = useState(null);
  const [history] = useState(HISTORY_SEED);

  const pickAgent = (a) => {
    setActiveAgent(a);
    setActiveHistory(null);
  };
  const openHistory = (h) => {
    const a = AGENTS.find(x=>x.id===h.agentId);
    if (a) {
      setActiveAgent(a);
      setActiveHistory(h);
      setSection("history");
    }
  };
  const closeChat = () => {
    setActiveAgent(null);
    setActiveHistory(null);
  };

  const crumbs = useMemo(() => {
    const root = "Home";
    if (activeAgent) {
      const sectionLabel = section==="history" ? "채팅 히스토리" : "에이전트";
      return [root, sectionLabel, activeAgent.name];
    }
    if (section==="tools") return [root, "도구 관리"];
    if (section==="history") return [root, "채팅 히스토리"];
    return [root, "에이전트"];
  }, [section, activeAgent]);

  return (
    <div style={{display:"flex",minHeight:"100vh"}}>
      <Sidebar
        section={section}
        setSection={(s)=>{ setSection(s); if (s!=="agents" && s!=="history") setActiveAgent(null); }}
        onPick={pickAgent}
        activeAgentId={activeAgent?.id}
        history={history}
        onOpenHistory={openHistory}
        activeHistoryId={activeHistory?.id}
      />
      <main style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",height:"100vh"}}>
        <Header crumbs={crumbs} agent={activeAgent} onClose={closeChat}/>
        <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
          {activeAgent ? (
            <ChatView agent={activeAgent} onBack={closeChat} seedTitle={activeHistory?.title}/>
          ) : section === "tools" ? (
            <div style={{flex:1,overflowY:"auto"}}><ToolsPage/></div>
          ) : section === "history" ? (
            <div style={{flex:1,overflowY:"auto"}}><HistoryPage history={history} onOpen={openHistory}/></div>
          ) : (
            <div style={{flex:1,overflowY:"auto"}}><AgentsGallery onPick={pickAgent}/></div>
          )}
        </div>
      </main>
    </div>
  );
}

function HistoryPage({ history, onOpen }) {
  return (
    <div style={{padding:"32px 36px",maxWidth:1100,margin:"0 auto"}}>
      <div style={{marginBottom:24}}>
        <div style={{fontSize:11,letterSpacing:1.4,color:"var(--primary)",fontWeight:700,marginBottom:8}}>CHAT HISTORY</div>
        <h1 style={{margin:0,fontSize:28,fontWeight:700,letterSpacing:-.4}}>채팅 히스토리</h1>
        <p style={{margin:"8px 0 0",color:"var(--muted)",fontSize:14}}>이전 대화를 다시 열어 이어가거나 검토할 수 있습니다.</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {history.map(h => {
          const a = AGENTS.find(x=>x.id===h.agentId);
          return (
            <button key={h.id} onClick={()=>onOpen(h)} style={{
              display:"flex",alignItems:"center",gap:14,padding:"14px 16px",
              borderRadius:11,background:"linear-gradient(180deg,#101a30,#0d1424)",
              border:"1px solid var(--border)",textAlign:"left",
              transition:"all .15s",color:"var(--text)"
            }}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=a.color+"60";e.currentTarget.style.transform="translateX(4px)";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.transform="translateX(0)";}}>
              <div style={{
                width:38,height:38,borderRadius:9,
                background:`linear-gradient(135deg, ${a.color}, ${a.color}66)`,
                display:"flex",alignItems:"center",justifyContent:"center",
                boxShadow:`0 0 0 1px ${a.color}40`,flexShrink:0
              }}>
                <Icon name={a.icon} size={17} stroke={2}/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,marginBottom:3}}>{h.title}</div>
                <div style={{fontSize:12,color:"var(--muted)",display:"flex",gap:8}}>
                  <span style={{color:a.color}}>{a.name}</span>
                  <span style={{color:"var(--muted-2)"}}>·</span>
                  <span>{h.time}</span>
                </div>
              </div>
              <Icon name="chevronRight" size={16}/>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
